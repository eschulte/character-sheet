<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Board Room</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
        background: #121923;
        color: #edf2f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #344155;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      header h1 {
        flex: 0 0 auto;
      }
      .header-status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        min-width: 0;
        margin-left: auto;
      }
      .header-status label {
        white-space: nowrap;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .app {
        max-width: 1440px;
        margin: auto;
        padding: 16px;
      }
      .toolbar,
      .audio-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px;
        background: #202b38;
        border: 1px solid #344155;
      }
      .toolbar {
        border-radius: 8px 8px 0 0;
        position: relative;
        z-index: 2;
      }
      button {
        border: 1px solid #536477;
        background: #334155;
        color: #fff;
        padding: 6px 9px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover,
      button.active {
        background: #526b86;
      }
      button.active {
        outline: 2px solid #f6c453;
      }
      .toolbar-more {
        position: relative;
      }
      .toolbar-more summary {
        list-style: none;
        border: 1px solid #536477;
        background: #334155;
        color: #fff;
        padding: 6px 9px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
      }
      .toolbar-more summary::-webkit-details-marker {
        display: none;
      }
      .toolbar-more[open] summary,
      .toolbar-more summary:hover {
        background: #526b86;
      }
      .toolbar-extra {
        position: absolute;
        top: calc(100% - 1px);
        right: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        width: min(680px, calc(100vw - 48px));
        min-width: min(480px, calc(100vw - 48px));
        max-width: min(760px, calc(100vw - 48px));
        padding: 10px;
        background: #202b38;
        border: 1px solid #536477;
        border-radius: 6px;
        box-shadow: 0 8px 20px #0008;
      }
      label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.82rem;
      }
      input,
      select {
        min-height: 29px;
        max-width: 125px;
        border: 1px solid #536477;
        border-radius: 3px;
        background: #17212e;
        color: #fff;
        padding: 3px;
      }
      input[type='color'] {
        padding: 1px;
        width: 38px;
      }
      #viewport {
        height: calc(100vh - 160px);
        min-height: 440px;
        position: relative;
        overflow: hidden;
        background: #aab8c8;
        border: 2px solid #344155;
        touch-action: none;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
      }
      .pan-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 4;
        display: grid;
        grid-template: repeat(3, 36px) / repeat(3, 36px);
        gap: 4px;
      }
      .pan-controls button {
        padding: 0;
        font-size: 18px;
        line-height: 1;
        touch-action: manipulation;
      }
      .pan-up { grid-area: 1 / 2; }
      .pan-left { grid-area: 2 / 1; }
      .pan-right { grid-area: 2 / 3; }
      .pan-down { grid-area: 3 / 2; }
      .editor {
        position: absolute;
        z-index: 2;
        width: 230px;
        padding: 8px;
        display: grid;
        gap: 6px;
        background: #17212e;
        border: 1px solid #64748b;
        border-radius: 5px;
        box-shadow: 0 8px 18px #0009;
      }
      .editor input {
        max-width: none;
        width: 100%;
      }
      .editor .row {
        display: flex;
        gap: 5px;
      }
      .diagnostic {
        color: #a9b7c5;
        font-size: 0.78rem;
        margin-left: auto;
      }
      #diagnostic {
        max-width: 55vw;
        overflow-wrap: anywhere;
        text-align: right;
      }
      .room-panel {
        margin-top: 14px;
        border: 1px solid #344155;
        background: #17212e;
        border-radius: 8px;
        overflow: hidden;
      }
      .room-panel h2 {
        font-size: 1rem;
        margin: 0;
        padding: 10px;
        background: #202b38;
      }
      .room-join {
        padding: 10px;
      }
      .room-stage {
        height: 250px;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at center, #30465e, #17212e);
        touch-action: none;
      }
      .person {
        position: absolute;
        width: 78px;
        height: 46px;
        transform: translate(-50%, -50%);
        border: 2px solid #93c5fd;
        border-radius: 23px;
        background: #1d4f78;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 0.76rem;
        text-align: center;
        cursor: grab;
        user-select: none;
      }
      .person.self {
        border-color: #f6c453;
        background: #755b21;
      }
      .room-status {
        font-size: 0.82rem;
        color: #a9b7c5;
        padding: 0 10px 10px;
      }
      .construction {
        margin: 14px 0;
        padding: 18px;
        text-align: center;
        border: 2px dashed #f6c453;
        border-radius: 8px;
        background: #3a2f1b;
        color: #fde68a;
        font-size: 1rem;
      }
      .construction .cone {
        font-size: 3rem;
        display: block;
      }
      .workspace-tabs {
        display: flex;
        gap: 8px;
        margin: 0;
      }
      .workspace-tabs button {
        min-width: 78px;
      }
      .workspace-tabs button.active {
        background: #526b86;
        outline: 2px solid #f6c453;
      }
      .workspace-tab {
        display: none;
      }
      .workspace-tab.active {
        display: block;
      }
      @media (min-width: 1000px) {
        .toolbar-more {
          flex: 1 1 100%;
        }
        .toolbar-more summary {
          display: none;
        }
        .toolbar-extra {
          position: static;
          width: 100%;
          min-width: 0;
          max-width: none;
          padding: 0;
          background: transparent;
          border: 0;
          box-shadow: none;
          display: flex;
        }
      }
      @media (min-width: 1800px) {
        .app {
          max-width: none;
        }
        #board-tab {
          position: relative;
        }
        .toolbar-more {
          flex: 0 0 auto;
          position: static;
        }
        .toolbar-extra {
          position: absolute;
          top: calc(100% + 1px);
          left: 1452px;
          right: auto;
          z-index: 3;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          flex-wrap: nowrap;
          width: 300px;
          min-width: 0;
          max-width: 300px;
          max-height: calc(100vh - 190px);
          overflow-y: auto;
          padding: 10px;
          background: #202b38;
          border: 1px solid #536477;
          border-radius: 6px;
          box-shadow: 0 8px 20px #0008;
        }
        #viewport {
          width: min(1440px, 100%);
        }
      }
      @media (max-width: 700px) {
        header {
          display: grid;
          grid-template-columns: auto 1fr;
          align-items: center;
          gap: 8px 12px;
          padding: 10px;
        }
        .workspace-tabs {
          justify-content: flex-end;
        }
        .header-status {
          flex-wrap: wrap;
          gap: 4px 10px;
          grid-column: 1 / -1;
          justify-content: space-between;
        }
        .app {
          padding: 8px;
        }
        #viewport {
          height: calc(100vh - 225px);
        }
        .diagnostic {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Board Room</h1>
      <nav class="workspace-tabs" aria-label="Workspace tabs">
        <button id="tab-board" class="active">Board</button><button id="tab-room">Room</button>
      </nav>
      <div class="header-status">
        <span id="diagnostic">Board ready</span>
        <label><input id="webrtc-share" type="checkbox" /> WebRTC live edits</label>
      </div>
    </header>
    <main class="app">
      <section id="board-tab" class="workspace-tab active" aria-label="Drawing board">
        <section class="toolbar" aria-label="Board tools">
          <button data-tool="select" class="active">Select</button><button data-tool="shape">Shape</button
          ><button data-tool="text">Text</button><button data-tool="draw">Draw</button
          ><button id="save-board">Save board</button><button
            id="share-board"
            title="Save stores the map; this link opens the same board. WebRTC edits are on by default and do not use the microphone. Open Room for audio. Click blank space for a ripple; click shapes or text to edit; copy/paste duplicates selections."
            aria-label="Copy share link and show board help"
            >Copy share link</button
          >
          <details class="toolbar-more">
            <summary>More tools</summary>
            <div class="toolbar-extra">
              <button data-tool="line">Line</button><button id="delete">Delete</button>
              <label>Shape type
                <select id="shape">
                  <option value="rectangle">Rectangle</option>
                  <option value="rounded-rectangle">Rounded rectangle</option>
                  <option value="ellipse">Ellipse / circle</option>
                  <option value="octagon">Octagon</option>
                </select>
              </label>
              <label>Fill <input id="fill" type="color" value="#dbeafe" /></label>
              <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" title="Fill opacity" /></label>
              <label>Font <input id="font-size" type="number" min="8" max="96" value="18" title="Text size" /></label>
              <label>Draw / border <input id="line-color" type="color" value="#dc2626" /></label>
              <label>Width <input id="line-width" type="number" min="1" max="20" value="3" /></label>
              <label>Preset
                <select id="preset"><option value="">Choose saved shape…</option></select>
              </label>
              <label><input id="preset-name" placeholder="Preset name" maxlength="40" /></label>
              <button id="save-preset" type="button">Save preset</button><button id="add-preset" type="button">Add preset</button>
              <label>Background
                <select id="background">
                  <option value="hex-grid" selected>Hex grid</option>
                  <option value="square-grid">Square grid</option>
                </select>
              </label>
              <label>Grid <input id="grid" type="number" min="10" max="200" value="50" /></label>
            </div>
          </details>
        </section>
        <div id="viewport">
          <svg id="canvas" role="application" aria-label="Tactical map and diagram board"></svg>
          <div class="pan-controls" role="group" aria-label="Pan the board">
            <button class="pan-up" type="button" data-pan-y="80" aria-label="Pan up" title="Pan up">▲</button>
            <button class="pan-left" type="button" data-pan-x="80" aria-label="Pan left" title="Pan left">◀</button>
            <button class="pan-right" type="button" data-pan-x="-80" aria-label="Pan right" title="Pan right">▶</button>
            <button class="pan-down" type="button" data-pan-y="-80" aria-label="Pan down" title="Pan down">▼</button>
          </div>
        </div>
      </section>
      <section id="room-tab" class="workspace-tab" aria-label="Physical audio room">
        <div class="construction" role="status">
          <span class="cone">🚧</span>Room tools are under construction. Audio/spatial room controls are temporarily
          unavailable.
        </div>
        <section class="room-panel" aria-label="Physical audio room">
          <h2>Physical room</h2>
          <div class="room-join">
            <label>Room <input id="room-id" value="test-room" maxlength="64" /></label>
            <label>Name <input id="participant-name" value="Guest" maxlength="30" /></label>
            <button id="join-room">Join audio room</button> <button id="leave-room" disabled>Leave</button>
          </div>
          <div id="room-stage" class="room-stage" aria-label="Drag participants to change spatial audio"></div>
          <div id="room-status" class="room-status">
            Not connected. Joining connects to the room; microphone access is requested when audio starts.
          </div>
        </section>
        <section class="audio-controls" aria-label="Local audio controls">
          <button id="microphone">Enable microphone</button><button id="mic-mute">Mute microphone</button
          ><label>Base volume <input id="base-volume" type="range" min="0" max="1" value="1" step="0.01" /></label
          ><button id="output-mute">Mute output</button
          ><label>Output <input id="output-volume" type="range" min="0" max="1" value="1" step="0.01" /></label
          ><span class="diagnostic" id="audio-diagnostic">Audio not started</span>
        </section>
      </section>
    </main>
    <script>
      const desktopTools = window.matchMedia('(min-width: 1000px)');
      const moreTools = document.querySelector('.toolbar-more');
      const syncMoreTools = () => {
        moreTools.open = desktopTools.matches;
      };
      desktopTools.addEventListener('change', syncMoreTools);
      syncMoreTools();
    </script>
    <script src="https://unpkg.com/@metered-ca/realtime@1.2.1/dist/index.umd.js"></script>
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        deleteDoc,
        getDoc,
        onSnapshot,
      } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
      const firebaseConfig = {
        apiKey: 'AIzaSyAMfAkyUevv3BDKSO3yBjRra3jZ_uV5OlA',
        authDomain: 'dnd-character-sheet-5e.firebaseapp.com',
        projectId: 'dnd-character-sheet-5e',
        storageBucket: 'dnd-character-sheet-5e.firebasestorage.app',
        messagingSenderId: '554732035132',
        appId: '1:554732035132:web:ed89be7af2ceea147a7739',
      };
      const firestore = getFirestore(initializeApp(firebaseConfig));
      /* Board state and room/audio state are intentionally separate. Board x/y NEVER control audio. */
      const NS = 'http://www.w3.org/2000/svg',
        $ = (id) => document.getElementById(id),
        uid = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
      const boardState = {
        metadata: { background: { mode: 'hex-grid', gridSize: 50 } },
        objects: new Map(),
      };
      const roomState = { participants: new Map() }; // Reserved only for physical-room x/y, baseVolume and audio.
      let selected = null,
        selectedIds = new Set(),
        tool = 'select',
        view = { x: 0, y: 0, scale: 1 },
        action = null,
        clipboardShapes = [];
      let useWebRtcLiveEdits = new URLSearchParams(location.search).get('sync') !== 'firestore';
      const pings = new Map();
      function pingColorFor(clientId) {
        let hash = 2166136261;
        for (const char of clientId) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
        return `hsl(${(hash >>> 0) % 360}, 82%, 62%)`;
      }
      let pingFrame = 0;
      function animatePings() {
        if (!pings.size) {
          pingFrame = 0;
          return;
        }
        render();
        pingFrame = requestAnimationFrame(animatePings);
      }
      // A browser-tab session id is intentional until Firebase Auth supplies a durable participant identity.
      const clientId = uid(),
        channel = new BroadcastChannel('board-room-v1');
      let sequence = 0;

      // Isolated transport adapter: replace send/onmessage with a WebRTC DataChannel; no renderer changes required.
      const sync = {
        send(operation) {
          channel.postMessage(operation);
          window.boardRoomBroadcast?.({ kind: 'board-op', operation });
        },
        emit(type, objectId, patch) {
          const op = {
            protocol: 'board-room-v1',
            channel: 'board',
            opId: uid(),
            clientId,
            sequence: ++sequence,
            type,
            objectId,
            patch,
            timestamp: Date.now(),
          };
          applyOperation(op);
          sync.send(op);
          if (!useWebRtcLiveEdits) persistLiveBoard(op);
        },
        receive(operation) {
          if (operation?.protocol === 'board-room-v1' && operation.clientId !== clientId) applyOperation(operation);
        },
      };
      channel.onmessage = (e) => sync.receive(e.data);
      window.boardRoomSync = sync;
      function applyOperation(op) {
        if (op.type === 'metadata') Object.assign(boardState.metadata.background, op.patch);
        else if (op.type === 'create') boardState.objects.set(op.objectId, op.patch);
        else if (op.type === 'update' && boardState.objects.has(op.objectId))
          Object.assign(boardState.objects.get(op.objectId), op.patch, {
            version: (boardState.objects.get(op.objectId).version || 0) + 1,
            updatedAt: op.timestamp,
            updatedBy: op.clientId,
          });
        else if (op.type === 'delete') {
          boardState.objects.delete(op.objectId);
          selectedIds.delete(op.objectId);
          if (selected === op.objectId) selected = [...selectedIds].at(-1) || null;
        }
        else if (op.type === 'ping') {
          pings.set(op.opId, { ...op.patch, color: pingColorFor(op.clientId), at: Date.now() });
          if (!pingFrame) animatePings();
          setTimeout(() => {
            pings.delete(op.opId);
            render();
          }, 1800);
        }
        render();
      }
      function el(name, attrs = {}) {
        const n = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        return n;
      }
      const svg = $('canvas');
      document.querySelector('.pan-controls').addEventListener('click', (e) => {
        const button = e.target.closest('button[data-pan-x], button[data-pan-y]');
        if (!button) return;
        view.x += Number(button.dataset.panX || 0);
        view.y += Number(button.dataset.panY || 0);
        render();
      });
      function point(e) {
        const r = svg.getBoundingClientRect();
        return { x: (e.clientX - r.left - view.x) / view.scale, y: (e.clientY - r.top - view.y) / view.scale };
      }
      function background(defs) {
        const b = boardState.metadata.background,
          size = Math.max(10, +b.gridSize || 50);
        const p = el('pattern', { id: 'bg', width: size, height: size, patternUnits: 'userSpaceOnUse' });
        if (b.mode === 'hex-grid' || b.mode === 'octagonal-grid') {
          const r = size / 2,
            h = Math.sqrt(3) * r,
            w = 3 * r;
          p.setAttribute('width', w);
          p.setAttribute('height', h);
          const hex = (cx, cy) =>
            el('path', {
              d: `M ${cx - r} ${cy} L ${cx - r / 2} ${cy - h / 2} L ${cx + r / 2} ${cy - h / 2} L ${cx + r} ${cy} L ${cx + r / 2} ${cy + h / 2} L ${cx - r / 2} ${cy + h / 2} Z`,
              fill: 'none',
              stroke: '#7c8ca0',
              'stroke-width': 1,
            });
          p.append(hex(r, h / 2), hex(2.5 * r, 0), hex(2.5 * r, h));
        } else
          p.append(
            el('path', { d: `M ${size} 0 L 0 0 0 ${size}`, fill: 'none', stroke: '#7c8ca0', 'stroke-width': 1 }),
          );
        defs.append(p);
        return [
          el('rect', { x: -10000, y: -10000, width: 20000, height: 20000, fill: '#e5edf5' }),
          el('rect', { x: -10000, y: -10000, width: 20000, height: 20000, fill: 'url(#bg)' }),
        ];
      }
      function render() {
        svg.replaceChildren();
        const defs = el('defs'),
          arrow = el('marker', {
            id: 'arrow',
            viewBox: '0 0 10 10',
            refX: 9,
            refY: 5,
            markerWidth: 6,
            markerHeight: 6,
            orient: 'auto-start-reverse',
          });
        arrow.append(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#111827' }));
        defs.append(arrow);
        svg.append(defs);
        const layer = el('g', { transform: `translate(${view.x} ${view.y}) scale(${view.scale})` }),
          bg = background(defs);
        layer.append(...(Array.isArray(bg) ? bg : [bg]));
        svg.append(layer);
        [...boardState.objects.values()]
          .sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0))
          .forEach((o) => {
            drawObject(layer, o);
            if (o.opacity != null && layer.lastElementChild) layer.lastElementChild.setAttribute('opacity', o.opacity);
          });
        pings.forEach((p) => {
          const age = Math.max(0, Date.now() - p.at),
            radius = 10 + age * 0.12,
            alpha = Math.max(0, 1 - age / 1800);
          layer.append(
            el('circle', {
              cx: p.x,
              cy: p.y,
              r: radius,
              fill: 'none',
              stroke: p.color,
              'stroke-width': 3,
              opacity: alpha,
            }),
            el('circle', { cx: p.x, cy: p.y, r: 4, fill: p.color, opacity: alpha }),
          );
        });
        if (action?.kind === 'create' && action.current) {
          const s = action.start,
            e = action.current;
          drawObject(layer, {
            id: 'preview',
            type: 'shape-text',
            x: Math.min(s.x, e.x),
            y: Math.min(s.y, e.y),
            width: Math.max(1, Math.abs(e.x - s.x)),
            height: Math.max(1, Math.abs(e.y - s.y)),
            ...settings(),
            opacity: 0.45,
          });
        }
        if (action?.kind === 'draw' && action.points?.length > 1)
          drawObject(layer, {
            id: 'preview',
            type: 'draw',
            path: action.points.map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' '),
            stroke: $('line-color').value,
            strokeWidth: +$('line-width').value || 3,
          });
        if (action?.kind === 'marquee' && action.current) {
          const x = Math.min(action.start.x, action.current.x),
            y = Math.min(action.start.y, action.current.y);
          layer.append(
            el('rect', {
              x,
              y,
              width: Math.abs(action.current.x - action.start.x),
              height: Math.abs(action.current.y - action.start.y),
              fill: '#3b82f6',
              'fill-opacity': 0.14,
              stroke: '#2563eb',
              'stroke-dasharray': '5 3',
              'pointer-events': 'none',
            }),
          );
        }
      }
      function drawObject(layer, o) {
        const g = el('g', {
          'data-id': o.id,
          transform: o.rotation ? `rotate(${o.rotation} ${o.x + o.width / 2} ${o.y + o.height / 2})` : '',
        });
        if (o.type === 'line') {

        $('background').value = boardState.metadata.background.mode || 'hex-grid';
        $('grid').value = boardState.metadata.background.gridSize || 50;
      }
      function attachLiveBoardListener() {
        boardUnsubscribe?.();
        boardUnsubscribe = onSnapshot(
          doc(firestore, 'boardBoards', boardId),
          (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            if (data.updatedBy === clientId) return;
            boardState.metadata = data.metadata || boardState.metadata;
            boardState.objects.clear();
            (data.objects || []).forEach((o) => boardState.objects.set(o.id, o));
            render();
            console.info('[Board Room] Live board update received', {
              boardId,
              objectCount: boardState.objects.size,
              updatedBy: data.updatedBy || null,
              updatedAt: data.updatedAt || null,
            });
          },
          (e) => console.error('[Board Room] Live board listener failed', { boardId, ...errorDetails(e) }),
        );
      }
      function persistLiveBoard(operation) {
        // Serialize writes so rapid edits cannot finish out of order and replace newer board state.
        liveWriteChain = liveWriteChain
          .catch(() => {})
          .then(() =>
            setDoc(
              doc(firestore, 'boardBoards', boardId),
              { ...boardPayload(), lastOperationId: operation.opId },
              { merge: true },
            ),
          )
          .then(() =>
            console.info('[Board Room] Live edit saved', {
              boardId,
              operationId: operation.opId,
              type: operation.type,
              objectCount: boardState.objects.size,
            }),
          )
          .catch((e) =>
            console.error('[Board Room] Live edit save failed', {
              boardId,
              operationId: operation.opId,
              type: operation.type,
              ...errorDetails(e),
            }),
          );
      }
      function reportBoardStatus(message, details) {
        $('diagnostic').textContent = message;
        if (details) console.info('[Board Room]', message, details);
        else console.info('[Board Room]', message);
      }
      function errorDetails(e) {
        return {
          name: e?.name || 'Error',
          code: e?.code || null,
          message: e?.message || String(e),
          stack: e?.stack || null,
        };
      }
      async function saveBoard() {
        const payload = boardPayload(),
          localKey = `board-${boardId}`;
        console.info('[Board Room] Save started', {
          boardId,
          objectCount: payload.objects.length,
          objectIds: payload.objects.map((o) => o.id),
          project: firebaseConfig.projectId,
        });
        try {
          await setDoc(doc(firestore, 'boardBoards', boardId), payload, { merge: true });
          reportBoardStatus(`Saved to Firestore · board ${boardId} · ${payload.objects.length} objects`, {
            boardId,
            objectCount: payload.objects.length,
          });
        } catch (e) {
          console.error('[Board Room] Firestore save failed; saving locally instead', { boardId, ...errorDetails(e) });
          try {
            localStorage.setItem(localKey, JSON.stringify(payload));
            reportBoardStatus(`Saved locally only · board ${boardId} · ${payload.objects.length} objects`, {
              boardId,
              objectCount: payload.objects.length,
              error: errorDetails(e),
            });
          } catch (localError) {
            console.error('[Board Room] Local save also failed', {
              boardId,
              firestoreError: errorDetails(e),
              localError: errorDetails(localError),
            });
            reportBoardStatus(
              `Save failed · ${e?.code || e?.name || 'Firestore'}; local storage also failed · see console`,
              { firestoreError: errorDetails(e), localError: errorDetails(localError) },
            );
          }
        }
      }
      async function loadBoard() {
        const localKey = `board-${boardId}`;
        reportBoardStatus(`Loading board ${boardId}…`, {
          boardId,
          boardIdFromUrl,
          origin: location.origin,
          project: firebaseConfig.projectId,
        });
        try {
          console.info('[Board Room] Firestore load started', { boardId, project: firebaseConfig.projectId });
          const snap = await getDoc(doc(firestore, 'boardBoards', boardId));
          if (snap.exists()) {
            const data = snap.data();
            Object.assign(boardState.metadata, data.metadata || {});
            syncBackgroundControls();
            boardState.objects.clear();
            (data.objects || []).forEach((o) => boardState.objects.set(o.id, o));
            render();
            reportBoardStatus(`Loaded from Firestore · board ${boardId} · ${boardState.objects.size} objects`, {
              boardId,
              source: 'firestore',
              objectCount: boardState.objects.size,
              updatedAt: data.updatedAt || null,
            });
            attachLiveBoardListener();
            return;
          }
          console.info('[Board Room] Firestore document does not exist', { boardId });
          const raw = localStorage.getItem(localKey);
          if (raw) {
            const data = JSON.parse(raw);
            Object.assign(boardState.metadata, data.metadata || {});
            syncBackgroundControls();
            boardState.objects.clear();
            (data.objects || []).forEach((o) => boardState.objects.set(o.id, o));
            render();
            reportBoardStatus(`Loaded locally · board ${boardId} · ${boardState.objects.size} objects`, {
              boardId,
              source: 'localStorage',
              objectCount: boardState.objects.size,
              updatedAt: data.updatedAt || null,
            });
            return;
          }
          reportBoardStatus(`New board · ${boardId} · add content, then save or copy a share link`, {
            boardId,
            source: 'empty',
            firestoreDocumentExists: false,
            localCopyExists: false,
          });
          attachLiveBoardListener();
        } catch (e) {
          console.error('[Board Room] Firestore load failed', { boardId, ...errorDetails(e) });
          try {
            const raw = localStorage.getItem(localKey);
            if (raw) {
              const data = JSON.parse(raw);
              Object.assign(boardState.metadata, data.metadata || {});
              syncBackgroundControls();
              boardState.objects.clear();
              (data.objects || []).forEach((o) => boardState.objects.set(o.id, o));
              render();
              reportBoardStatus(
                `Firestore unavailable · loaded local copy · board ${boardId} · ${boardState.objects.size} objects`,
                {
                  boardId,
                  source: 'localStorage-after-firestore-error',
                  objectCount: boardState.objects.size,
                  error: errorDetails(e),
                },
              );
              return;
            }
            reportBoardStatus(
              `Load failed · ${e?.code || e?.name || 'Firestore'} · ${e?.message || e} · board ${boardId}`,
              { boardId, source: 'none', localCopyExists: false, error: errorDetails(e) },
            );
          } catch (localError) {
            console.error('[Board Room] Local fallback read failed', {
              boardId,
              firestoreError: errorDetails(e),
              localError: errorDetails(localError),
            });
            reportBoardStatus(`Load failed · see console · board ${boardId}`, {
              boardId,
              firestoreError: errorDetails(e),
              localError: errorDetails(localError),
            });
          }
        }
      }
      $('save-board').onclick = saveBoard;
      $('share-board').onclick = async () => {
        const u = new URL(location.href);
        u.searchParams.set('board', boardId);
        u.searchParams.set('sync', $('webrtc-share').checked ? 'webrtc' : 'firestore');
        try {
          await navigator.clipboard.writeText(u.href);
          reportBoardStatus(`Share link copied · board ${boardId}`, {
            boardId,
            shareUrl: u.href,
            storage: $('webrtc-share').checked
              ? 'Firestore board storage and Metered signaling; WebRTC data channel for live edits'
              : 'Firestore required for cross-browser sharing',
          });
        } catch (e) {
          console.error('[Board Room] Clipboard copy failed', { shareUrl: u.href, ...errorDetails(e) });
          reportBoardStatus(`Could not copy link · board ${boardId} · see console`, {
            boardId,
            shareUrl: u.href,
            error: errorDetails(e),
          });
        }
      };

      // Explicit Web Audio mixer. Attach each remote decoded MediaStream independently; never mix before gain/pan.
      const VoiceMode = {
        voice: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
          sampleRate: 48000,
        },
        highFidelity: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 2,
          sampleRate: 48000,
        },
      };
      class SpatialAudioMixer {
        constructor() {
          this.context = null;
          this.master = null;
          this.remoteAudio = new Map();
          this.outputMuted = false;
        }
        async start(mode = 'voice') {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: VoiceMode[mode] || VoiceMode.voice });
          this.context = new AudioContext();
          this.master = this.context.createGain();
          this.master.connect(this.context.destination);
          const t = stream.getAudioTracks()[0],
            s = t.getSettings?.() || {};
          $('audio-diagnostic').textContent =
            `Mic ${s.sampleRate || 'default'}Hz, ${s.channelCount || 1} channel; ${t.readyState}`;
          return stream;
        }
        addParticipant(id, stream) {
          this.removeParticipant(id);
          const source = this.context.createMediaStreamSource(stream),
            gain = this.context.createGain(),
            panner = this.context.createStereoPanner();
          source.connect(gain).connect(panner).connect(this.master);
          this.remoteAudio.set(id, { stream, sourceNode: source, gainNode: gain, pannerNode: panner });
        }
        setParticipantVolume(id, volume) {
          this.remoteAudio
            .get(id)
            ?.gainNode.gain.setTargetAtTime(Math.max(0, Math.min(1, volume)), this.context.currentTime, 0.02);
        }
        setParticipantPan(id, pan) {
          this.remoteAudio
            .get(id)
            ?.pannerNode.pan.setTargetAtTime(Math.max(-1, Math.min(1, pan)), this.context.currentTime, 0.02);
        }
        removeParticipant(id) {
          const r = this.remoteAudio.get(id);
          if (r) {
            r.sourceNode.disconnect();
            r.gainNode.disconnect();
            r.pannerNode.disconnect();
            this.remoteAudio.delete(id);
          }
        }
      }
      const mixer = new SpatialAudioMixer();
      window.boardRoomAudio = mixer;
      let localTrack = null,
        localStream = null;
      $('microphone').onclick = async () => {
        try {
          localStream ??= await mixer.start();
          localTrack = localStream.getAudioTracks()[0];
          if (meteredPeer) meteredPeer.addStream(localStream, { role: 'voice' });
          $('microphone').textContent = 'Microphone enabled';
        } catch (e) {
          $('audio-diagnostic').textContent = `Microphone unavailable: ${e.message}`;
        }
      };
      $('mic-mute').onclick = () => {
        if (localTrack) localTrack.enabled = !localTrack.enabled;
        $('mic-mute').textContent = localTrack?.enabled ? 'Mute microphone' : 'Unmute microphone';
      };
      $('output-mute').onclick = () => {
        if (!mixer.master) return;
        mixer.outputMuted = !mixer.outputMuted;
        mixer.master.gain.value = mixer.outputMuted ? 0 : +$('output-volume').value;
        $('output-mute').textContent = mixer.outputMuted ? 'Unmute output' : 'Mute output';
      };
      $('output-volume').oninput = (e) => {
        if (mixer.master && !mixer.outputMuted) mixer.master.gain.value = +e.target.value;
      };
      $('base-volume').oninput = (e) => {
        window.boardRoomLocalState = { ...(window.boardRoomLocalState || {}), baseVolume: +e.target.value };
        sendPresence();
      };
      // Room transport calls this after position data arrives. Gain is computed locally, never transmitted per listener.
      window.updateSpatialAudio = (listener, speaker) => {
        const d = Math.hypot(listener.x - speaker.x, listener.y - speaker.y),
          near = 80,
          far = 520,
          t = Math.max(0, Math.min(1, (d - near) / (far - near))),
          attenuation = d <= near ? 1 : d >= far ? 0 : 1 - t * t * (3 - 2 * t);
        mixer.setParticipantVolume(speaker.id, (speaker.baseVolume ?? 1) * attenuation);
        mixer.setParticipantPan(speaker.id, Math.max(-1, Math.min(1, (speaker.x - listener.x) / far)));
      };

      // Firestore stores room presence; Metered handles signaling, TURN and peer connections.
      let roomId = null,
        peers = new Map(),
        presenceUnsub = null,
        presenceTimer = null,
        meteredPeer = null;
      const METERED_PUBLISHABLE_KEY = 'pk_live_ea436d40e36de32ec3f81ebe1224fcf3b410c8e3';
      function status(s) {
        $('room-status').textContent = s;
        $('diagnostic').textContent = s;
      }
      function currentPresence() {
        return {
          id: clientId,
          name: $('participant-name').value.trim() || 'Guest',
          transportId: meteredPeer?.peerId || null,
          x: roomState.participants.get(clientId)?.x ?? 500,
          y: roomState.participants.get(clientId)?.y ?? 500,
          baseVolume: +$('base-volume').value,
          updatedAt: Date.now(),
        };
      }
      function roomRef() {
        return doc(firestore, 'boardRooms', roomId);
      }
      function participantRef(id = clientId) {
        return doc(firestore, 'boardRooms', roomId, 'participants', id);
      }
      function roomMessage(data) {
        try {
          const m = typeof data === 'string' ? JSON.parse(data) : data;
          if (!m || typeof m !== 'object') return;
          if (m.kind === 'board-op') sync.receive(m.operation);
          if (m.kind === 'presence') {
            const participant = m.participant;
            if (!participant?.id) return;
            roomState.participants.set(participant.id, participant);
            renderRoom();
            attachRemoteAudio(participant.transportId);
            updateSpatial();
          }
        } catch (e) {
          console.warn('Invalid room data message', e);
        }
      }
      function attachRemoteAudio(id) {
        if (!id || !mixer.context) return;
        const entry = peers.get(id);
        if (!entry?.remoteStream || entry.attachedStream === entry.remoteStream) return;
        mixer.addParticipant(id, entry.remoteStream);
        entry.attachedStream = entry.remoteStream;
        updateSpatial();
      }
      function wireDataChannel(id, dc) {
        const entry = peers.get(id);
        if (!entry) return;
        entry.dc = dc;
        dc.onmessage = (e) => roomMessage(e.data);
        dc.onclose = () => {
          if (entry.dc === dc) entry.dc = null;
        };
      }
      function trackRemotePeer(remote) {
        const id = remote.id;
        if (!id || peers.has(id)) return;
        const entry = { remote, dc: null, remoteStream: null, attachedStream: null };
        peers.set(id, entry);
        remote.on('track', ({ streams }) => {
          entry.remoteStream = streams?.[0] || null;
          entry.attachedStream = null;
          attachRemoteAudio(id);
        });
        remote.on('data-channel', ({ channel }) => wireDataChannel(id, channel));
        remote.on('connection-reset', () => {
          entry.dc = null;
          entry.attachedStream = null;
          if (!remote.polite) wireDataChannel(id, remote.pc.createDataChannel('board-room-v1', { ordered: true }));
        });
        if (!remote.polite) wireDataChannel(id, remote.pc.createDataChannel('board-room-v1', { ordered: true }));
        status(`Room connected · ${peers.size} peer${peers.size === 1 ? '' : 's'}`);
        sendPresence();
      }
      function removeRemotePeer(remote) {
        const id = remote.id,
          entry = peers.get(id);
        peers.delete(id);
        mixer.removeParticipant(id);
        if (entry?.remoteStream) {
          const participant = [...roomState.participants.values()].find((p) => p.transportId === id);
          if (participant) roomState.participants.delete(participant.id);
        }
        renderRoom();
        status(`Room connected · ${peers.size} peer${peers.size === 1 ? '' : 's'}`);
      }
      function updateSpatial() {
        const listener = roomState.participants.get(clientId);
        if (!listener) return;
        for (const speaker of roomState.participants.values()) {
          if (speaker.id !== clientId && speaker.transportId)
            window.updateSpatialAudio(listener, { ...speaker, id: speaker.transportId });
        }
      }
      function renderRoom() {
        const stage = $('room-stage');
        stage.replaceChildren();
        for (const p of roomState.participants.values()) {
          const node = document.createElement('div');
          node.className = `person ${p.id === clientId ? 'self' : ''}`;
          node.dataset.id = p.id;
          node.style.left = `${p.x / 10}%`;
          node.style.top = `${p.y / 10}%`;
          node.textContent = p.name;
          stage.append(node);
        }
      }
      function broadcast(message) {
        for (const [id, { dc }] of peers) {
          if (dc?.readyState === 'open') dc.send(JSON.stringify(message));
          else meteredPeer?.sendTo(id, message).catch((e) => console.warn('Room message was not delivered', e));
        }
      }
      window.boardRoomBroadcast = broadcast;
      function sendPresence() {
        if (!roomId) return;
        const p = currentPresence();
        roomState.participants.set(clientId, p);
        broadcast({ kind: 'presence', participant: p });
        renderRoom();
        updateSpatial();
        clearTimeout(presenceTimer);
        presenceTimer = setTimeout(() => setDoc(participantRef(), p).catch(console.error), 80);
      }
      $('room-stage').addEventListener('pointerdown', (e) => {
        const id = e.target.dataset.id;
        if (id !== clientId) return;
        const stage = e.currentTarget,
          move = (ev) => {
            const r = stage.getBoundingClientRect();
            const p = roomState.participants.get(clientId);
            p.x = Math.max(0, Math.min(1000, ((ev.clientX - r.left) / r.width) * 1000));
            p.y = Math.max(0, Math.min(1000, ((ev.clientY - r.top) / r.height) * 1000));
            sendPresence();
          };
        stage.setPointerCapture(e.pointerId);
        move(e);
        stage.onpointermove = move;
        stage.onpointerup = () => {
          stage.onpointermove = null;
          stage.onpointerup = null;
        };
      });
      async function joinRoom(withAudio = true) {
        try {
          if (withAudio && !localStream) {
            localStream ??= await mixer.start();
            localTrack = localStream.getAudioTracks()[0];
          }
          if (!roomId) {
            roomId = (useWebRtcLiveEdits ? `board-${boardId}` : $('room-id').value.trim())
              .replace(/[^a-zA-Z0-9_-]/g, '')
              .slice(0, 64);
            if (!roomId) throw new Error('Enter a room name');
            await setDoc(roomRef(), { protocol: 'board-room-v1', updatedAt: Date.now() }, { merge: true });
            presenceUnsub = onSnapshot(collection(roomRef(), 'participants'), (snap) => {
              const next = new Map();
              snap.forEach((d) => next.set(d.id, d.data()));
              for (const [id, participant] of roomState.participants)
                if (!next.has(id) && id !== clientId) mixer.removeParticipant(participant.transportId);
              roomState.participants.clear();
              next.forEach((participant, id) => roomState.participants.set(id, participant));
              for (const participant of next.values()) attachRemoteAudio(participant.transportId);
              renderRoom();
              updateSpatial();
            });
            const MeteredPeer = window.MeteredPeer?.MeteredPeer;
            if (!MeteredPeer) throw new Error('Metered Realtime SDK failed to load');
            meteredPeer = new MeteredPeer({ apiKey: METERED_PUBLISHABLE_KEY });
            meteredPeer.on('peer-joined', ({ peer }) => trackRemotePeer(peer));
            meteredPeer.on('peer-left', ({ peer }) => removeRemotePeer(peer));
            meteredPeer.on('data', ({ data }) => roomMessage(data));
            meteredPeer.on('state-change', ({ to }) => {
              if (to === 'reconnecting') status('Reconnecting to room…');
              else if (to === 'joined') status(`Room connected · ${peers.size} peer${peers.size === 1 ? '' : 's'}`);
            });
            meteredPeer.on('error', ({ err }) => {
              console.error('Metered Realtime error', err);
              status(`Metered connection error: ${err.message || err.name}`);
            });
            if (localStream) meteredPeer.addStream(localStream, { role: 'voice' });
            await meteredPeer.join(roomId);
            $('join-room').disabled = true;
            $('leave-room').disabled = false;
            if (withAudio) $('microphone').textContent = 'Microphone enabled';
            status(`Joined ${roomId}; waiting for peers`);
            sendPresence();
          } else if (withAudio && localStream) {
            meteredPeer.addStream(localStream, { role: 'voice' });
            $('join-room').disabled = true;
            $('leave-room').disabled = false;
            $('microphone').textContent = 'Microphone enabled';
          }
        } catch (e) {
          console.error('Could not join Metered room', e);
          if (meteredPeer?.state !== 'joined') {
            presenceUnsub?.();
            presenceUnsub = null;
            if (meteredPeer) await meteredPeer.close('join failed').catch(console.error);
            meteredPeer = null;
            roomId = null;
          }
          status(`Could not join: ${e.message}`);
        }
      }
      async function leaveRoom() {
        presenceUnsub?.();
        presenceUnsub = null;
        clearTimeout(presenceTimer);
        for (const id of peers.keys()) {
          mixer.removeParticipant(id);
        }
        peers.clear();
        if (roomId) await deleteDoc(participantRef()).catch(() => {});
        roomState.participants.clear();
        renderRoom();
        if (meteredPeer) await meteredPeer.close('left room').catch(console.error);
        meteredPeer = null;
        roomId = null;
        $('join-room').disabled = false;
        $('leave-room').disabled = true;
        status('Left room');
      }
      $('join-room').onclick = () => joinRoom(true);
      $('leave-room').onclick = leaveRoom;
      $('webrtc-share').onchange = async (e) => {
        useWebRtcLiveEdits = e.target.checked;
        if (useWebRtcLiveEdits) await joinRoom(false);
        else if (roomId) await leaveRoom();
      };
      window.addEventListener('pagehide', () => {
        if (roomId) deleteDoc(participantRef()).catch(() => {});
      });
      function switchWorkspace(tab) {
        const board = tab === 'board';
        $('board-tab').classList.toggle('active', board);
        $('room-tab').classList.toggle('active', !board);
        $('tab-board').classList.toggle('active', board);
        $('tab-room').classList.toggle('active', !board);
        if (board) render();
      }
      $('tab-board').onclick = () => switchWorkspace('board');
      $('tab-room').onclick = () => switchWorkspace('room');
      render();
      loadBoard().then(() => {
        if (useWebRtcLiveEdits) joinRoom(false);
      });
    </script>
  </body>
