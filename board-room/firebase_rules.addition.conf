// Add this match inside the existing `service cloud.firestore { match /databases/{database}/documents { ... } }` block.
// DEVELOPMENT ONLY: the board-room prototype has no Firebase Authentication yet.
// Replace `true` with a room-membership check before any public deployment.
match /boardRooms/{roomId} {
  allow read, write: if true;

  match /participants/{participantId} {
    allow read, write: if true;
  }

  // Ephemeral offer, answer, and ICE-candidate mailbox documents.
  match /signals/{signalId} {
    allow read, create, delete: if true;
  }
}

match /boardBoards/{boardId} {
  allow read, write: if true;
}
